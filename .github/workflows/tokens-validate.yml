name: Validate tokens

# Runs on every PR commit (no paths filter) so that when tokens-build.yml
# auto-commits regenerated build output, this check re-runs on the new head
# SHA and can go green — allowing auto-merge to fire if branch protection
# is configured. (A path-filtered workflow that is skipped counts as
# "Expected / pending", not "Success", for required status checks.)
#
# Also runs on push to main to keep the build gate on the default branch.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/tokens/**"

jobs:
  check:
    name: tokens:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build script is zero-dep, so no `npm ci` needed.
      - name: Re-run build and verify generated files match source
        run: node packages/tokens/check-generated.mjs

      - name: Validate JSON sources parse cleanly
        run: |
          for f in packages/tokens/source/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || (echo "::error file=$f::Invalid JSON" && exit 1)
          done
          echo "All source JSON files parse cleanly."
