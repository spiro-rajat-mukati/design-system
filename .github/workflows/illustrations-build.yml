name: illustrations-build

on:
  push:
    paths:
      - 'packages/illustrations/svg/**'
      - 'packages/illustrations/raster-src/**'
      - 'packages/illustrations/build.mjs'
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PAT for push-back)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          token: ${{ secrets.TOKENS_BUILD_PAT }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install dependencies (includes sharp)
        run: npm ci

      - name: Build illustrations
        run: node packages/illustrations/build.mjs

      - name: Commit generated files if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            packages/illustrations/src/ \
            packages/illustrations/raster/ \
            packages/illustrations/manifest.ts \
            packages/illustrations/index.ts \
            packages/illustrations/native.ts
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore(illustrations): regenerate components from sources [skip ci]"
            git push
          fi
